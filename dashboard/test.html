<!DOCTYPE html>
<html>
<head>
    <title>Gamma Wall Bounce - Live Metrics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #eaeaea;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .metric-card {
            background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 15px;
        }
        .metric-label {
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
        }
        .metric-value {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
            font-family: 'Monaco', 'Consolas', monospace;
        }
        .status-connected { color: #4ade80; }
        .status-disconnected { color: #f87171; }
        .last-update { color: #94a3b8; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1 style="margin: 0;">Gamma Wall Bounce - Live Metrics</h1>
            <span id="status" class="status-disconnected">● Disconnected</span>
        </div>
        <div class="last-update">
            Last update: <span id="last-update">--</span>
        </div>
    </div>

    <div id="metrics-grid" class="grid"></div>

    <script>
        const statusEl = document.getElementById('status');
        const gridEl = document.getElementById('metrics-grid');
        const lastUpdateEl = document.getElementById('last-update');
        
        function updateDisplay(metrics) {
            gridEl.innerHTML = '';
            
            for (const [key, value] of Object.entries(metrics)) {
                const card = document.createElement('div');
                card.className = 'metric-card';
                
                const label = document.createElement('div');
                label.className = 'metric-label';
                label.textContent = key.replace(/_/g, ' ').toUpperCase();
                
                const valueEl = document.createElement('div');
                valueEl.className = 'metric-value';
                
                // Format value
                if (typeof value === 'number') {
                    if (value === null || value === undefined) {
                        valueEl.textContent = 'N/A';
                    } else if (Math.abs(value) < 0.01) {
                        valueEl.textContent = value.toFixed(6);
                    } else if (Math.abs(value) > 1000) {
                        valueEl.textContent = (value / 1000).toFixed(1) + 'K';
                    } else {
                        valueEl.textContent = value.toFixed(2);
                    }
                } else {
                    valueEl.textContent = value;
                }
                
                card.appendChild(label);
                card.appendChild(valueEl);
                gridEl.appendChild(card);
            }
        }
        
        async function fetchMetrics() {
            try {
                const response = await fetch('/api/metrics/gamma_wall_bounce/latest');
                if (response.ok) {
                    const metrics = await response.json();
                    if (Object.keys(metrics).length > 0) {
                        updateDisplay(metrics);
                        statusEl.innerHTML = '● Connected';
                        statusEl.className = 'status-connected';
                        lastUpdateEl.textContent = new Date().toLocaleTimeString();
                    }
                }
            } catch (error) {
                statusEl.innerHTML = '● Error';
                statusEl.className = 'status-disconnected';
            }
        }
        
        // Fetch immediately, then every 5 seconds
        fetchMetrics();
        setInterval(fetchMetrics, 5000);
    </script>
</body>
</html>
