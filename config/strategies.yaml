# Syngex Strategy Configuration
# Edit this file to enable/disable strategies or tune parameters.
# Changes take effect on restart.

# Global settings
global:
  min_confidence: 0.35
  max_signals_per_tick: 10
  dedup_window_seconds: 60
  signal_log_path: "log/signals.jsonl"

# Layer 1: Structural (GEX + OHLC) — 8 strategies
layer1:
  gamma_wall_bounce:
    enabled: true
    tracker:
      max_hold_seconds: 1800
    params:
      # Distance to wall to consider "bounce" (0.5%)
      wall_proximity_pct: 0.005
      # Stop placement beyond wall (0.4%)
      stop_past_wall_pct: 0.004
      # Target/risk ratio for position sizing
      target_risk_mult: 1.5
      # Minimum |GEX| to consider a wall ($500k)
      min_wall_gex: 500000
      # Minimum confidence to emit signal
      min_confidence: 0.25
      # Maximum confidence cap for wall bounce signals
      max_confidence: 0.85

  magnet_accelerate:
    enabled: true
    tracker:
      max_hold_seconds: 3600
    params:
      # Minimum |normalized GEX| to be considered a magnet ($500k)
      min_magnet_gex: 500000
      # Exit within this % of magnet (0.3%)
      magnet_exit_pct: 0.003
      # Price must be this far past magnet to breakout (0.2%)
      breakout_pct: 0.002
      # Max distance past magnet (no chasing) (2%)
      max_breakout_pct: 0.02
      # Trailing stop for Phase 2 (1%)
      trail_stop_pct: 0.01
      # Risk-reward multiplier for targets
      target_risk_mult: 1.5
      # Minimum confidence to emit signal
      min_confidence: 0.65

  gamma_flip_breakout:
    enabled: true
    tracker:
      max_hold_seconds: 3600
    params:
      # ATR multiplier for stop calculation (1.5× rolling range)
      atr_mult: 1.5
      # Flip proximity: price must be within this % of flip (2.5%)
      flip_proximity_pct: 0.025
      # Stop on other side of flip by this % (1%)
      stop_other_side_pct: 0.01
      # Risk-reward target (1:2.5)
      target_rr: 2.5
      # Minimum |net_gamma| for regime confidence ($500k)
      min_gamma_strength: 500000
      # Minimum confidence to emit signal
      min_confidence: 0.65

  gamma_squeeze:
    enabled: true
    tracker:
      max_hold_seconds: 1800
    params:
      # ATR threshold for pin detection (0.3%)
      atr_threshold: 0.003
      # Volume spike ratio for breakout confirmation
      volume_spike_ratio: 1.5
      # Minimum confidence to emit signal
      min_confidence: 0.25
      # Target risk multiplier for squeeze trades
      target_risk_mult: 1.5
      # Minimum wall GEX for squeeze qualification
      min_wall_gex: 500000
      # Minimum massive wall GEX for positive regime squeezes
      min_massive_wall_gex: 1000000

  gex_imbalance:
    enabled: true
    tracker:
      max_hold_seconds: 2700
    params:
      # Put heavy threshold: < 0.5 → long bias
      put_heavy_ratio: 0.5
      # Call heavy threshold: > 0.65 → short bias
      call_heavy_ratio: 0.65
      # Strong put ratio: very strong long signal
      strong_put_ratio: 0.25
      # Strong call ratio: very strong short signal
      strong_call_ratio: 0.75
      # Minimum messages/data points for signal quality
      min_messages: 20
      # Stop: 2.5x rolling price std dev
      stop_vol_mult: 2.5
      # Target: 1.5x stop distance
      target_risk_mult: 1.5
      # Minimum confidence to emit signal
      min_confidence: 0.55

  confluence_reversal:
    enabled: true
    tracker:
      max_hold_seconds: 3600
    params:
      # Minimum confluence score for signal (1-3)
      min_confluence_score: 2
      # Max distance for confluence (0.3%)
      confluence_distance_pct: 0.003
      # Minimum structural signals required
      min_structural_signals: 1
      # Base confidence for score 3
      max_confidence_base: 0.6
      # Stop percentage (0.8%)
      stop_pct: 0.008
      # Target: 2× risk
      target_risk_mult: 2.0
      # Maximum confidence cap
      max_confidence: 0.80
      # Minimum confidence to emit signal
      min_confidence: 0.65

  vol_compression_range:
    enabled: true
    tracker:
      max_hold_seconds: 7200
    params:
      # Compression threshold: max range for compression (0.3%)
      compression_pct: 0.003
      # Alternative compression threshold (0.5%)
      compression_threshold_pct: 0.5
      # Minimum data points in rolling window
      min_range_bars: 20
      # Wall edge proximity for edge trade (0.4%)
      wall_edge_proximity: 0.004
      # Stop percentage (0.6%)
      stop_pct: 0.006
      # Target: 1.5× risk
      target_risk_mult: 1.5
      # Max std of price for compression
      std_threshold: 0.002
      # Minimum confidence to emit signal
      min_confidence: 0.45

  gex_divergence:
    enabled: true
    tracker:
      max_hold_seconds: 3600
    params:
      # Minimum slope magnitude for divergence (0.05%)
      divergence_min_slope: 0.0005
      # Number of points for slope calculation
      divergence_window: 30
      # Confirmation candle percentage (0.2%)
      confirmation_candle_pct: 0.002
      # Stop percentage (0.5%)
      stop_pct: 0.005
      # Target: 1.5× risk
      target_risk_mult: 1.5
      # Minimum data points for slope calculation
      min_data_points: 15
      # Minimum GEX wall strength ($1M)
      min_total_gex: 1000000.0
      # Minimum confidence to emit signal
      min_confidence: 0.25

# Layer 2: Alpha Greeks — 5 strategies
layer2:
  delta_gamma_squeeze:
    enabled: true
    tracker:
      max_hold_seconds: 1800
    params:
      # Distance to wall to consider "squeeze" (2%)
      call_wall_proximity_pct: 0.02
      # Delta acceleration ratio for squeeze detection
      delta_accel_ratio: 1.15
      # Volume spike ratio for confirmation
      volume_spike_ratio: 1.2
      # Minimum data points for calculation
      min_data_points: 3
      # Stop below wall percentage
      stop_below_wall_pct: 0.003
      # Target risk multiplier
      target_risk_mult: 1.5
      # Minimum confidence to emit signal
      min_confidence: 0.25

  delta_volume_exhaustion:
    enabled: true
    tracker:
      max_hold_seconds: 2700
    params:
      # Minimum trend points for detection
      min_trend_points: 5
      # Minimum greeks points for calculation
      min_greeks_points: 5
      # Delta below rolling avg ratio (95%)
      delta_decline_ratio: 0.95
      # Volume below rolling avg ratio (90%)
      volume_decline_ratio: 0.90
      # Minimum trend duration (2 candles)
      min_trend_duration: 2
      # Stop beyond swing percentage (0.8%)
      stop_pct: 0.008
      # Mean reversion multiplier (target is rolling mean)
      mean_reversion_mult: 1.0
      # Minimum confidence to emit signal
      min_confidence: 0.25

  call_put_flow_asymmetry:
    enabled: true
    tracker:
      max_hold_seconds: 3600
    params:
      # Call score must exceed put score by this ratio
      flow_threshold: 1.5
      # Minimum greeks data points for aggregation
      min_greeks_points: 3
      # IV skew threshold (3%)
      iv_skew_threshold: 0.03
      # Stop percentage (0.6%)
      stop_pct: 0.006
      # Target: 2× risk
      target_risk_mult: 2.0
      # Minimum confidence to emit signal
      min_confidence: 0.35

  iv_gex_divergence:
    enabled: true
    tracker:
      max_hold_seconds: 2700
    params:
      # Price percentile threshold (p70 — top 30% of range)
      price_percentile_threshold: 0.70
      # Minimum price points for calculation
      min_price_points: 10
      # Minimum IV points for calculation
      min_iv_points: 5
      # Minimum positive gamma ($200k)
      min_positive_gamma: 200000
      # IV below rolling avg ratio (95%)
      iv_decline_ratio: 0.95
      # Stop percentage (0.6%)
      stop_pct: 0.006
      # Target: 1.5× risk toward mean
      target_risk_mult: 1.5
      # Minimum confidence to emit signal
      min_confidence: 0.25
      # Maximum confidence cap
      max_confidence: 0.95
      # Gamma wall threshold for target calculation
      gamma_wall_threshold: 500000

  delta_iv_divergence:
    enabled: true
    tracker:
      max_hold_seconds: 2700
    params:
      # Minimum data points for calculation
      min_data_points: 5
      # Minimum divergence strength (z-score magnitude)
      min_divergence_strength: 0.3
      # Stop percentage (0.8%)
      stop_pct: 0.008
      # Target: 2.0× risk
      target_risk_mult: 2.0
      # Minimum confidence to emit signal
      min_confidence: 0.35

# Layer 3: Micro-Signal (1Hz) — 4 strategies
layer3:
  gamma_volume_convergence:
    enabled: true
    tracker:
      max_hold_seconds: 900
    params:
      # Delta acceleration ratio for ignition
      delta_accel_ratio: 1.15
      # Delta accel minimum ratio (declining but positive)
      delta_accel_min_ratio: 0.30
      # Gamma spike ratio for ignition
      gamma_spike_ratio: 1.20
      # Volume spike ratio for confirmation
      volume_spike_ratio: 1.20
      # Stop percentage (0.5%)
      stop_pct: 0.005
      # Target percentage (1.0%)
      target_pct: 0.010
      # Minimum confidence to emit signal
      min_confidence: 0.25
      # Maximum confidence cap for micro-signals
      max_confidence: 0.90
      # Minimum data points in rolling windows
      min_data_points: 3
      # Price up threshold for convergence (0.1%)
      price_up_threshold: 0.001
      # Price down threshold for convergence (-0.1%)
      price_down_threshold: -0.001

  iv_band_breakout:
    enabled: true
    tracker:
      max_hold_seconds: 2700
    params:
      # Delta must be below rolling avg ratio (95%)
      delta_decel_ratio: 0.95
      # Price compression ratio (40%)
      price_compression_ratio: 0.40
      # Breakout move threshold (0.05%)
      breakout_move_pct: 0.0005
      # Volume trend required for breakout
      volume_trend_required: true
      # Stop percentage (0.5%)
      stop_pct: 0.005
      # Target percentage (1.0%)
      target_pct: 0.010
      # Minimum confidence to emit signal
      min_confidence: 0.25
      # Maximum confidence cap for micro-signals
      max_confidence: 0.85
      # Minimum data points for calculation
      min_data_points: 5
      # Minimum IV data points for compression check
      min_iv_data_points: 3

  strike_concentration:
    enabled: true
    tracker:
      max_hold_seconds: 900
    params:
      # How many top OI strikes to track
      top_oi_strikes_count: 3
      # Bounce proximity: price must be within this % of strike (0.5%)
      bounce_proximity_pct: 0.005
      # Slice body ratio: candle body must be > this % of range (30%)
      slice_body_ratio: 0.3
      # Slice volume ratio: 20% above rolling avg
      slice_volume_ratio: 1.20
      # Divergence volume threshold: volume < 80% of avg
      divergence_volume_threshold: 0.80
      # Stop for bounces: 0.3% beyond the strike
      stop_pct_bounce: 0.003
      # Stop for slices: 0.3% against entry
      stop_pct_slice: 0.003
      # Target: 1.5× risk for bounce targets
      target_risk_mult: 1.5
      # Minimum confidence to emit signal
      min_confidence: 0.25
      # Maximum confidence cap for micro-signals
      max_confidence: 0.85
      # Minimum data points for calculation
      min_data_points: 3

  theta_burn:
    enabled: true
    tracker:
      max_hold_seconds: 480
    params:
      # Minimum net gamma for pinning effect ($10k)
      min_net_gamma: 10000.0
      # Wall proximity percentage (0.5%)
      wall_proximity_pct: 0.005
      # Stop past wall percentage (0.3%)
      stop_past_wall_pct: 0.003
      # Minimum target percentage (0.2%)
      min_target_pct: 0.002
      # Maximum target percentage (0.4%)
      max_target_pct: 0.004
      # Range narrowness ratio for pinning (30%)
      range_narrowness_ratio: 0.30
      # Minimum confidence to emit signal
      min_confidence: 0.35
      # Maximum confidence cap
      max_confidence: 0.80
      # Minimum data points for calculation
      min_data_points: 3
      # Gamma strength high threshold
      gamma_strength_high: 500000
      # Midday UTC start time
      midnight_utc_start: 17
      # Midday UTC end time
      midnight_utc_end: 20
      # Volume threshold for divergence
      divergence_volume_threshold: 0.80

# Layer 4: Full-Data (v2) — 4 strategies
full_data:
  iv_skew_squeeze:
    enabled: true
    tracker:
      max_hold_seconds: 14400
    params:
      # Skew extreme positive: calls 20%+ more expensive (euphoria)
      skew_extreme_positive: 0.30
      # Skew extreme negative: puts 7%+ more expensive (panic)
      skew_extreme_negative: -0.10
      # Price stable threshold: max change % (0.5%)
      price_stable_threshold: 0.005
      # Minimum net gamma for positive regime ($50k)
      min_net_gamma: 5000.0
      # Stop percentage (0.5%)
      stop_pct: 0.005
      # Target percentage (0.8%)
      target_pct: 0.008
      # Minimum confidence to emit signal
      min_confidence: 0.35
      # Maximum confidence cap for v2 strategies
      max_confidence: 0.80
      # Minimum data points for basic checks
      min_data_points: 5
      # Minimum skew data points for rolling window
      min_skew_data_points: 10
      # Volume spike threshold (1.5×)
      volume_spike_threshold: 1.5

  prob_weighted_magnet:
    enabled: true
    tracker:
      max_hold_seconds: 2700
    params:
      # Minimum OI concentration (relative units)
      min_oi_concentration: 5.0
      # Price consolidation: 5m range < this % of 30m range (40%)
      consolidation_ratio: 0.40
      # Delta acceleration ratio (5% change)
      delta_accel_ratio: 1.10
      # Minimum net gamma for positive regime ($50k)
      min_net_gamma: 5000.0
      # Stop percentage (0.5%)
      stop_pct: 0.005
      # Target risk multiplier
      target_risk_mult: 1.5
      # Minimum confidence to emit signal
      min_confidence: 0.35
      # Maximum confidence cap for v2 strategies
      max_confidence: 0.80
      # Minimum data points for calculation
      min_data_points: 3

  prob_distribution_shift:
    enabled: true
    tracker:
      max_hold_seconds: 7200
    params:
      # Z-score threshold for signal (2.0σ)
      z_score_threshold: 2.0
      # Minimum consecutive signals required
      min_consecutive_signals: 3
      # Minimum net gamma for positive regime ($50k)
      min_net_gamma: 5000.0
      # Stop percentage (0.5%)
      stop_pct: 0.005
      # Target percentage (0.8%)
      target_pct: 0.008
      # Minimum confidence to emit signal
      min_confidence: 0.35
      # Maximum confidence cap for v2 strategies
      max_confidence: 0.80
      # Minimum strikes with data for distribution
      min_strikes_with_data: 5
      # Minimum data points for z-score calculation
      min_data_points: 10
      # Contribution threshold for breadth calculation (5%)
      contribution_threshold: 0.05

  extrinsic_intrinsic_flow:
    enabled: true
    tracker:
      max_hold_seconds: 10800
    params:
      # Extrinsic expansion threshold (3%)
      extrinsic_expansion_threshold: 0.05
      # Extrinsic collapse threshold (10%)
      extrinsic_collapse_threshold: 0.10
      # Volume spike ratio (1.50×)
      volume_spike_ratio: 1.50
      # Minimum net gamma for positive regime ($50k)
      min_net_gamma: 5000.0
      # Stop percentage (0.5%)
      stop_pct: 0.005
      # Target percentage (0.8%)
      target_pct: 0.008
      # Minimum confidence to emit signal
      min_confidence: 0.35
      # Maximum confidence cap for v2 strategies
      max_confidence: 0.80
      # Minimum data points for calculation
      min_data_points: 10

# Layer 0: Master Filter
filter:
  net_gamma:
    enabled: true
    params:
      # Flip buffer for regime determination
      flip_buffer: 0.5
